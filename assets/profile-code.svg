  <rect x="590" y="80" width="128" height="128" rx="64" fill="#111827" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="654" cy="132" r="28" fill="#1E293B"/>
  <path d="M630 128L644 115L658 128L672 115L686 128" stroke="#67E8F9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M637 149C646 157 662 157 671 149" stroke="#A78BFA" stroke-width="5" stroke-linecap="round"/>
  <text x="654" y="234" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">keep building</text>
