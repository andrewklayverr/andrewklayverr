<svg width="760" height="280" viewBox="0 0 760 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Crazy Chicken em produção</title>
  <desc id="desc">Painel visual mostrando a jornada do Crazy Chicken: descoberta, construção, gestão, deploy e uso real pelo cliente.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="76" y1="0" x2="680" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="758" height="278" rx="18" fill="url(#bg)" stroke="#263248" stroke-width="2"/>
  <rect x="1" y="1" width="758" height="48" rx="18" fill="#151E31"/>
  <path d="M1 31H759V49H1V31Z" fill="#151E31"/>
  <circle cx="27" cy="25" r="6" fill="#FB7185"/>
  <circle cx="48" cy="25" r="6" fill="#FBBF24"/>
  <circle cx="69" cy="25" r="6" fill="#34D399"/>
  <text x="103" y="30" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">crazychicken / production-dashboard</text>
  <text x="695" y="30" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">● online</text>

  <text x="42" y="79" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">do zero → produção</text>
  <text x="42" y="101" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">produto real · cliente real · problema real</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="42" y="123" width="155" height="48" rx="10" fill="#111827" stroke="#263248"/>
    <text x="57" y="144" fill="#22D3EE" font-size="11">01 / descoberta</text>
    <text x="57" y="160" fill="#CBD5E1" font-size="12">necessidade do negócio</text>

    <rect x="214" y="123" width="155" height="48" rx="10" fill="#111827" stroke="#263248"/>
    <text x="229" y="144" fill="#67E8F9" font-size="11">02 / construção</text>
    <text x="229" y="160" fill="#CBD5E1" font-size="12">interface + regras</text>

    <rect x="386" y="123" width="155" height="48" rx="10" fill="#111827" stroke="#263248"/>
    <text x="401" y="144" fill="#A78BFA" font-size="11">03 / gestão</text>
    <text x="401" y="160" fill="#CBD5E1" font-size="12">produtos + pedidos</text>

    <rect x="558" y="123" width="160" height="48" rx="10" fill="#111827" stroke="#F97316" stroke-opacity="0.7"/>
    <text x="573" y="144" fill="#FB923C" font-size="11">04 / produção</text>
    <text x="573" y="160" fill="#CBD5E1" font-size="12">cliente usando</text>
  </g>

  <path d="M68 204H692" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="68" cy="204" r="7" fill="#22D3EE"/>
  <circle cx="224" cy="204" r="7" fill="#67E8F9"/>
  <circle cx="380" cy="204" r="7" fill="#A78BFA"/>
  <circle cx="536" cy="204" r="7" fill="#FB923C"/>
  <circle cx="692" cy="204" r="9" fill="#F97316" stroke="#FED7AA" stroke-width="3"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <text x="42" y="232" fill="#64748B">menu.updated</text>
    <text x="216" y="232" fill="#64748B">admin.ready</text>
    <text x="365" y="232" fill="#64748B">order.received</text>
    <text x="526" y="232" fill="#64748B">client.online</text>
    <text x="42" y="255" fill="#34D399">$ status --project crazy-chicken</text>
    <text x="302" y="255" fill="#CBD5E1">production / serving real restaurant</text>
  </g>
</svg>
