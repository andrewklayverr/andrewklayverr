name: Atualizar jogo de contribuições

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar o repositório
        uses: actions/checkout@v4

      - name: Gerar animação dos commits
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: assets/github-contribution-grid-snake.svg

      - name: Salvar animação no perfil
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "chore: atualiza jogo de contribuições"
          add: assets/github-contribution-grid-snake.svg
